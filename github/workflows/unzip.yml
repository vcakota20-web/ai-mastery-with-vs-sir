name: Unzip uploads
on:
  push:
    paths: ['*.zip', '.github/workflows/unzip.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip website files
        run: |
          shopt -s nullglob
          for z in Website_Upload_*.zip; do unzip -o -q "$z" && git rm -q "$z"; done
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unzip uploaded website files"
          git push
      - name: Rebuild GitHub Pages
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
        env:
          GH_TOKEN: ${{ github.token }}
